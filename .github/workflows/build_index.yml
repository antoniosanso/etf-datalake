name: Datalake — Build Index & Latest

on:
  workflow_dispatch:
  schedule:
    - cron: "20 16 * * 1-5"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout datalake
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Build index.json and eod-latest.csv from data/*.csv
        run: |
          python scripts/build_index.py --data-root ./data --out-dir ./latest

      - name: Commit latest artifacts
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(latest): refresh index.json + eod-latest.csv"
          file_pattern: |
            latest/index.json
            latest/eod-latest.csv
          branch: main
          pull_strategy: "REBASE"
