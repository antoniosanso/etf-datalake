name: Update validated ETF universe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "universe.csv"
      - "scripts/update_universe.py"
      - "scripts/build_index.py"
      - ".github/workflows/fetch.yml"
  schedule:
    - cron: "30 16 * * 1-5"

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas pytest
      - name: Test OHLC validation
        run: pytest -q
      - name: Download and validate universe
        run: |
          python scripts/update_universe.py --min-valid 96
          python scripts/build_index.py --data-root data --out-dir latest
      - name: Verify published index
        run: |
          python - <<'PY'
          import json
          report = json.load(open("latest/quality-report.json"))
          index = json.load(open("latest/index.json"))
          assert report["status"] == "pass", report
          assert report["ohlc_invalid_rows"] == 0, report
          assert report["valid_count"] >= 96, report
          assert index["count"] == report["valid_count"], (index, report)
          print(f"Validated {report['valid_count']} ETFs")
          PY
      - name: Commit artifacts
        run: |
          git config user.name "autobot"
          git config user.email "autobot@users.noreply.github.com"
          git add -A
          git commit -m "data: refresh validated ETF universe" || echo "nothing to commit"
          git push
